<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>米兰华人基督教会 — 选择风格</title>
  <link rel="icon" type="image/png" href="https://www.milanchiesa.com/assets/icons/icon-512x512.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f5; color: #333;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 40px 20px;
    }
    .logo-mark { width: 64px; height: 64px; margin-bottom: 20px; color: #2c3e50; }
    h1 { font-size: 28px; color: #2c3e50; margin-bottom: 8px; }
    .subtitle { color: #888; font-size: 16px; margin-bottom: 48px; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; max-width: 900px; width: 100%; }
    .card {
      background: #fff; border-radius: 16px; padding: 32px 24px; text-align: center;
      text-decoration: none; color: inherit; transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); border: 2px solid transparent;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
    .color-bar { height: 6px; border-radius: 3px; margin-bottom: 20px; }
    .card h2 { font-size: 20px; margin-bottom: 8px; }
    .card p { font-size: 14px; color: #888; line-height: 1.6; }
    .card-v1 .color-bar { background: linear-gradient(90deg, #2c3e50, #3498db); }
    .card-v2 .color-bar { background: linear-gradient(90deg, #8B3A3A, #C9A84C); }
    .card-v3 .color-bar { background: linear-gradient(90deg, #FF6B6B, #4ECDC4); }
    @media (max-width: 768px) {
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <svg class="logo-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M127.281 45H171.8v134.526h-44.519V45zM340.2 331.474h44.52V466H340.2V331.474zM127.281 197.915H171.8V466h-44.519V197.915z"></path>
    <path d="M215.352 89.52v45.487H83.729V89.519h131.623zM340.2 45H384.72v269.053H340.2V45zM428.271 421.48V466H340.2v-44.52h88.071z"></path>
    <path fill-rule="evenodd" d="M340.2 399.221v3.871l1.936-1.643-1.936-2.228z" clip-rule="evenodd"></path>
    <path d="M171.8 197.399v66.447l59.91 67.628h46.167L340.2 94.514V45h-32.058l-62.087 234.992-74.255-82.593z"></path>
  </svg>
  <h1>米兰华人基督教会</h1>
  <p class="subtitle">选择你喜欢的风格预览</p>
  <div class="cards">
    <a href="v1/" class="card card-v1">
      <div class="color-bar"></div>
      <h2>v1 · 现代清新</h2>
      <p>海军蓝渐变，无衬线体，干净明亮的现代风格</p>
    </a>
    <a href="v2/" class="card card-v2">
      <div class="color-bar"></div>
      <h2>v2 · 温暖典雅</h2>
      <p>米白暖色调，衬线标题，古典优雅的教堂气质</p>
    </a>
    <a href="v3/" class="card card-v3">
      <div class="color-bar"></div>
      <h2>v3 · 大胆现代</h2>
      <p>深色背景，高对比度，年轻活力的潮流设计</p>
    </a>
  </div>
</body>
</html>
